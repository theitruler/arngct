<!-- navbar.html -->
<!-- Tailwind CSS for navbar -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: '#4f46e5',
                    secondary: '#7c3aed',
                    accent: '#ec4899'
                }
            }
        }
    }
</script>

<style>
    .text-primary { color: #4f46e5; }
    .bg-primary { background-color: #4f46e5; }
    .hover\:text-primary:hover { color: #4f46e5; }
    .hover\:bg-primary:hover { background-color: #4f46e5; }
    .bg-primary\/10 { background-color: rgba(79, 70, 229, 0.1); }
    .text-primary\/10 { color: rgba(79, 70, 229, 0.1); }
    .border-primary { border-color: #4f46e5; }
    .from-primary { --tw-gradient-from: #4f46e5; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(79, 70, 229, 0)); }
    .to-secondary { --tw-gradient-to: #7c3aed; }
    .hover\:from-primary:hover { --tw-gradient-from: #4f46e5; }
    .hover\:to-secondary:hover { --tw-gradient-to: #7c3aed; }
</style>

<nav class="fixed w-full z-50 bg-white/95 backdrop-blur-md shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-3">
            <!-- Left Links - Hidden on mobile, shown on desktop -->
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html#home" class="font-medium text-gray-700 hover:text-primary transition-all duration-300 relative group">
                    Home
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="aboutus.html" class="font-medium text-gray-700 hover:text-primary transition-all duration-300 relative group">
                    About Us
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="programs.html" class="font-medium text-gray-700 hover:text-primary transition-all duration-300 relative group">
                    Our Programs
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
                </a>
            </div>
            
            <!-- Mobile Menu Button - Shown only on mobile -->
            <button id="mobile-menu-button" class="md:hidden text-gray-700 focus:outline-none p-2" aria-label="Toggle menu">
                <i class="fas fa-bars text-2xl"></i>
            </button>
            
            <!-- Centered Logo -->
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="ARNGCT Logo" class="h-14 w-auto object-contain">
            </a>
            
            <!-- Right Links - Hidden on mobile, shown on desktop -->
            <div class="hidden md:flex items-center gap-8">
                <a href="index.html#donate" class="font-medium text-gray-700 hover:text-primary transition-all duration-300 relative group">
                    Donate
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="contact.html" class="font-medium text-gray-700 hover:text-primary transition-all duration-300 relative group">
                    Contact
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary transition-all duration-300 group-hover:w-full"></span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- Mobile Menu - Hidden by default -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
        <div class="container mx-auto px-4 py-4 flex flex-col gap-2">
            <a href="index.html#home" class="py-3 px-4 rounded-lg hover:bg-indigo-50 hover:text-primary transition-colors font-medium">
                <i class="fas fa-home mr-2"></i>Home
            </a>
            <a href="aboutus.html" class="py-3 px-4 rounded-lg hover:bg-indigo-50 hover:text-primary transition-colors font-medium">
                <i class="fas fa-users mr-2"></i>About Us
            </a>
            <a href="programs.html" class="py-3 px-4 rounded-lg hover:bg-indigo-50 hover:text-primary transition-colors font-medium">
                <i class="fas fa-hands-helping mr-2"></i>Our Programs
            </a>
            <a href="index.html#donate" class="py-3 px-4 rounded-lg hover:bg-indigo-50 hover:text-primary transition-colors font-medium">
                <i class="fas fa-heart mr-2"></i>Donate
            </a>
            <a href="contact.html" class="py-3 px-4 rounded-lg hover:bg-indigo-50 hover:text-primary transition-colors font-medium">
                <i class="fas fa-envelope mr-2"></i>Contact
            </a>
        </div>
    </div>
    
    <script>
        // Mobile menu toggle
        document.addEventListener('click', function(e) {
            if (e.target.closest('#mobile-menu-button')) {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            }
        });
    </script>
</nav>
