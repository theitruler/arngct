<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Programs | A.R.N Growth Charitable Trust</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        .program-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .program-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .hero-bg {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding-top: 100px;
            padding-bottom: 60px;
        }
        
        .section { padding: 60px 0; }
        
        .badge-ongoing {
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-upcoming {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Hero -->
    <section class="hero-bg">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Our Programs</h1>
            <p class="text-white/80 text-lg">Making a real difference in communities</p>
        </div>
    </section>

    <!-- Ongoing Programs -->
    <section class="section">
        <div class="container mx-auto px-4">
            <div class="text-center mb-8">
                <span class="badge-ongoing">🏃 Ongoing</span>
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mt-4">Active Programs</h2>
            </div>
            
            <div id="ongoing-programs" class="programs-grid"></div>
        </div>
    </section>

    <!-- Upcoming Programs -->
    <section class="section bg-white">
        <div class="container mx-auto px-4">
            <div class="text-center mb-8">
                <span class="badge-upcoming">⏰ Coming Soon</span>
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mt-4">Upcoming Programs</h2>
            </div>
            
            <div id="upcoming-programs" class="programs-grid"></div>
        </div>
    </section>

    <!-- CTA -->
    <section class="py-12" style="background: linear-gradient(135deg, #4f46e5, #7c3aed);">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-2xl font-bold text-white mb-4">Want to Get Involved?</h2>
            <a href="index.html#contact" class="inline-block bg-white text-indigo-600 px-8 py-3 rounded-full font-semibold">
                Join Us <i class="fas fa-arrow-right ml-2"></i>
            </a>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script>
        // Load navbar and footer
        fetch('navbar.html').then(r => r.text()).then(html => {
            document.getElementById('navbar-container').innerHTML = html;
        });
        
        fetch('footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
        
        // Create program card HTML
        function createProgramCard(program) {
            const badgeClass = program.type === 'ongoing' ? 'badge-ongoing' : 'badge-upcoming';
            const badgeText = program.type === 'ongoing' ? '🏃 Ongoing' : '⏰ Upcoming';
            
            return `
                <div class="program-card">
                    <div class="relative h-48">
                        <img src="${program.image}" alt="${program.program_name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                        <div class="absolute top-3 right-3">
                            <span class="${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="absolute bottom-3 left-3 w-10 h-10 bg-white rounded-full flex items-center justify-center">
                            <i class="${program.icon} text-indigo-600"></i>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold text-gray-800 mb-2">${program.program_name}</h3>
                        <p class="text-gray-600 text-sm mb-3">${program.short_description}</p>
                        <p class="text-gray-500 text-sm"><i class="fas fa-map-marker-alt mr-1"></i> ${program.location} &nbsp; <i class="fas fa-calendar ml-2 mr-1"></i> ${program.date}</p>
                    </div>
                </div>
            `;
        }
        
        // Load and render programs from JSON
        fetch('data/programs.json')
            .then(r => r.json())
            .then(data => {
                const ongoingContainer = document.getElementById('ongoing-programs');
                const upcomingContainer = document.getElementById('upcoming-programs');
                
                const ongoing = data.programs.filter(p => p.type === 'ongoing');
                const upcoming = data.programs.filter(p => p.type === 'upcoming');
                
                if (ongoing.length > 0) {
                    ongoingContainer.innerHTML = ongoing.map(createProgramCard).join('');
                } else {
                    ongoingContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No ongoing programs at the moment.</p>';
                }
                
                if (upcoming.length > 0) {
                    upcomingContainer.innerHTML = upcoming.map(createProgramCard).join('');
                } else {
                    upcomingContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No upcoming programs announced yet.</p>';
                }
            })
            .catch(err => {
                console.error('Error loading programs:', err);
                document.getElementById('ongoing-programs').innerHTML = '<p class="text-center text-red-500">Error loading programs.</p>';
            });
    </script>
    
    <!-- Footer Placeholder -->
    <div id="footer-container"></div>
    
    <!-- Load Navbar & Footer -->
    <script>
        // Load Navbar
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(err => console.error('Error loading navbar:', err));
        
        // Load Footer
        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error('Footer not found');
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            })
            .catch(err => {
                console.error('Error loading footer:', err);
                if (!document.getElementById('footer-container').innerHTML)
                    document.getElementById('footer-container').innerHTML =
                        '<footer class="bg-dark text-white py-6 text-center">Footer failed.</footer>';
            });
    </script>
</body>
</html>
