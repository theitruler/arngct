<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin login | A.R.N Growth Charitable Trust</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="page-title">
        <img class="brand-mark" src="../logo.png" alt="A.R.N Growth Charitable Trust">
        <p class="eyebrow">A.R.N Growth Charitable Trust</p>
        <h1 id="page-title">Admin login</h1>
        <form id="admin-login-form" novalidate>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button type="submit">Sign in</button>
          <p id="login-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
