server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify handles public HTTPS. Directory redirects must not expose
    # the container's HTTP scheme or internal port.
    absolute_redirect off;

    # Serve the campaign without an external trailing-slash redirect.
    location = /sanitarypad {
        try_files /sanitarypad/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
